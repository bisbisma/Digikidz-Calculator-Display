<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Challenge Kalkulator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style> 
        .kotak-Kalkulator {
            width: 280px;
            height: auto;
            background-color: #FAC213;
            padding: 15px;
            border: 5px solid #000000;
            margin: 0 auto;
        }

        .kotak-Layar {
            width: 100%;
            height: 80px;
            background-color: #FEF9A7;
            border: 5px solid #000000;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .kotak-Tombol {
            width: 100%;
            height: auto;
            border: 5px solid #000000;
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
        }

        .tombol-Kalkulator {
            width: 25%;
            height: 65px; 
            background-color: #F77E21;
            border: 1px solid #000000;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        /* Styling Footer Sosmed */
        footer {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            gap: 40px;
        }

        .link-sosmed {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 20px 30px;
            color: white; 
            text-decoration: underline; /* Sesuai gambar awal */
        }

        .instagram {
            background-color: #E1306C;
        }

        .facebook {
            background-color: #3b5998;
        }

        .github {
            background-color: #333;
        }

       

        /* Media Query untuk HP */
        @media only screen and (max-width: 768px) {  

            .kotak-Kalkulator {
                width: 90%;
                max-width: 320px; /* Membatasi agar tidak terlalu melebar di tablet */
                box-sizing: border-box;
            }

            .kotak-Layar {
                height: 60px;
            }

            .tombol-Kalkulator {
                width: 25%; /* Tetap 4 kolom agar bentuk kalkulator terjaga di HP */
                height: 55px;
            }
            
            footer {
                flex-direction: column;
                gap: 15px;
            }

            .link-sosmed {
                width: 200px;
                padding: 15px 20px;
            }
        }
    </style>
</head>

<body>
    <h1 style="text-align: center;"> Display Kalkulator</h1>

    <!-- Kotak Kalkulator -->
    <div class="kotak-Kalkulator"> 
        <!-- Layar Kalkulator -->
        <div class="kotak-Layar"></div>

        <!-- Kotak Tombol -->
        <div class="kotak-Tombol"> 
            <div class="tombol-Kalkulator">7</div>
            <div class="tombol-Kalkulator">8</div>
            <div class="tombol-Kalkulator">9</div>
            <div class="tombol-Kalkulator">C</div>

            <div class="tombol-Kalkulator">4</div>
            <div class="tombol-Kalkulator">5</div>
            <div class="tombol-Kalkulator">6</div>
            <div class="tombol-Kalkulator">*</div>

            <div class="tombol-Kalkulator">1</div>
            <div class="tombol-Kalkulator">2</div>
            <div class="tombol-Kalkulator">3</div>
            <div class="tombol-Kalkulator">/</div>

            <div class="tombol-Kalkulator">0</div>
            <div class="tombol-Kalkulator">=</div>
            <div class="tombol-Kalkulator">-</div>
            <div class="tombol-Kalkulator">+</div>
        </div>
    </div>
  
<p style="text-align: center;"> created by: Bisma Agam Gunawan</p>  

    <!-- Footer Sosmed -->
    <footer>
        <a href="https://www.instagram.com" target="_blank" class="link-sosmed instagram">
            Instagram <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://www.facebook.com" target="_blank" class="link-sosmed facebook">
            Facebook <i class="fa-brands fa-facebook"></i>
        </a>
        <a href="https://www.github.com" target="_blank" class="link-sosmed github">
            Github <i class="fa-brands fa-github"></i>
        </a>

    
    </footer>
</body>
</html>
